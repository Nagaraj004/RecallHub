<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Center Brain & Spaced Recall Node Graphics -->
  <g transform="translate(256, 256) scale(7.5) translate(-16, -16)">
    <!-- Recall Loop Rings -->
    <circle cx="16" cy="16" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    
    <!-- Central Brain Symbol -->
    <path
      d="M9.5 7.5A4.5 4.5 0 0 1 14 5c1.2 0 2.25.48 3 1.25A4.5 4.5 0 0 1 22.5 7.5c2.48 0 4.5 2.02 4.5 4.5 0 1.05-.36 2.02-.97 2.78.61.76.97 1.73.97 2.72 0 2.48-2.02 4.5-4.5 4.5a4.46 4.46 0 0 1-2.5-.76A4.46 4.46 0 0 1 17.5 23c-1.38 0-2.5-1.12-2.5-2.5 0-.17.02-.34.05-.5H15c-.28 0-.55-.03-.81-.08A4.47 4.47 0 0 1 9.5 22C7.02 22 5 19.98 5 17.5c0-.99.36-1.96.97-2.72A4.47 4.47 0 0 1 5 12c0-2.48 2.02-4.5 4.5-4.5z"
      fill="none"
      stroke="url(#brainGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Brain Hemispheric Connector -->
    <path
      d="M16 6v14M12 10c1.5.8 2.5.8 4 0M12 14c1.5.8 2.5.8 4 0M16 10c1.5.8 2.5.8 4 0M16 14c1.5.8 2.5.8 4 0"
      fill="none"
      stroke="url(#brainGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Memory Pulse Sparkle -->
    <circle cx="24" cy="8" r="2" fill="#38bdf8" />
    <circle cx="8" cy="22" r="1.5" fill="#a855f7" />
  </g>
</svg>
